<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floating Tech Icons</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
  }
  html,body{
    height:100%;
    margin:0;
    background: transparent;
    overflow:hidden;
    font-family: -apple-system, Segoe UI, sans-serif;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  #stage{
    position:relative;
    width:100%;
    height:100vh;
  }
  .icon{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background: rgba(0,0,0,0.03);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12), inset 0 0 0 1px rgba(0,0,0,0.05);
    will-change: transform;
  }
  .icon i, .icon svg{
    pointer-events:none;
  }
  .hint{
    position:absolute;
    top: calc(12px + env(safe-area-inset-top,0px));
    left:50%;
    transform: translateX(-50%);
    color: rgba(0,0,0,0.35);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="hint">icon cloud</div>
<div id="stage"></div>

<script>
const brands = [
  ["react","#61dafb"],["html5","#e34f26"],["css3-alt","#264de4"],["js","#f7df1e"],
  ["php","#787cb5"],["python","#3776ab"],["docker","#2496ed"],["git-alt","#f05032"],
  ["github","#181717"],["npm","#cb3837"],["node-js","#5fa04e"],["aws","#ff9900"],
  ["figma","#a259ff"],["sass","#cc6699"],["vuejs","#42b883"],["angular","#dd0031"],
  ["swift","#f05138"],["android","#3ddc84"],["apple","#111111"],["linux","#fcc624"],
  ["gitlab","#fc6d26"],["wordpress","#21759b"],["laravel","#ff2d20"],["trello","#0079bf"],
  ["slack","#e01e5a"]
];

const stage = document.getElementById('stage');
const W = () => stage.clientWidth;
const H = () => stage.clientHeight;
const n = brands.length;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

const icons = brands.map(([name, color], i) => {
  const size = 40 + (i % 5) * 6;
  const el = document.createElement('div');
  el.className = 'icon';
  el.style.width = size+'px';
  el.style.height = size+'px';
  el.innerHTML = `<i class="fa-brands fa-${name}" style="font-size:${size*0.55}px;color:${color};"></i>`;
  stage.appendChild(el);
  return {
    el, size,
    ring: Math.sqrt(i + 1),
    angle: i * goldenAngle,
    phase: Math.random() * Math.PI * 2,
    speed: 0.6 + Math.random() * 0.6,
    amp: 5 + Math.random() * 6
  };
});

let t = 0;
function step(){
  const w = W(), h = H();
  const cx = w/2, cy = h/2;
  const maxR = Math.min(w, h) * 0.46;
  const c = maxR / Math.sqrt(n);
  t += 0.016;
  for(const p of icons){
    const r = c * p.ring;
    const homeX = cx + r * Math.cos(p.angle) - p.size/2;
    const homeY = cy + r * Math.sin(p.angle) - p.size/2;
    const x = homeX + Math.sin(t * p.speed + p.phase) * p.amp;
    const y = homeY + Math.cos(t * p.speed * 1.3 + p.phase) * p.amp;
    p.el.style.transform = `translate(${x}px, ${y}px)`;
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
